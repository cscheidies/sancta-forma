<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sancta Forma: Restore the Balance</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Share+Tech+Mono&family=Cinzel+Decorative:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #06070d;
      --surface:   #0d0f18;
      --surface2:  #111420;
      --border:    #1e1a30;
      --border2:   #2a2040;
      --text:      #ddd5f0;
      --text-dim:  #6b6080;
      --cyan:      #00e5ff;
      --magenta:   #e040fb;
      --green:     #69ff47;
      --yellow:    #ffcc00;
      --red:       #ff4747;
      --arcane:    #9060ff;
      --arcane-dim:#4a2a9a;
      --font-mono: 'Share Tech Mono', monospace;
      --font-main: 'Space Grotesk', sans-serif;
      --font-eerie:'Cormorant Garamond', serif;
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-main);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    /* Two bg layers for smooth crossfade */
    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-color: #06070d;
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      transition: opacity 2.8s ease-in-out;
      will-change: opacity;
      transform: translateZ(0);        /* GPU layer — improves scaling quality + fade perf */
      image-rendering: high-quality;   /* Chrome 83+: use best available upscaling */
      image-rendering: -webkit-optimize-contrast; /* Safari: same intent */
    }
    /* On portrait screens the 2.36:1 images would centre-crop vertically;
       shift up slightly so the scene reads better on tall phones */
    @media (orientation: portrait) {
      .bg-layer { background-position: center 20%; }
    }

    /* Vignette — edges fade to pure black */
    #bg-vignette {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: radial-gradient(
        ellipse 90% 85% at 50% 50%,
        transparent 30%,
        rgba(0,0,0,0.45) 65%,
        rgba(0,0,0,0.88) 85%,
        #000 100%
      );
    }

    #starfield {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      transition: opacity 1.0s ease;
    }
    #fog-layer {
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
    }

    #app {
      position: relative;
      z-index: 4;
    }

    #app {
      width: 100%;
      max-width: 720px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Level Select ──────────────────────────────────── */
    .screen { width: 100%; padding: 24px 16px; }

    .screen-header { text-align: center; margin-bottom: 28px; }

    /* Level select fills the viewport and starts from the top,
       preventing #app's vertical centering from pushing the grid down */
    .level-select {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      align-self: flex-start;
      width: 100%;
    }

    /* ── Title screen ── */
    .title-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100dvh;
      padding: 60px 24px 48px;
    }
    .title-btn-row {
      display: flex;
      gap: 20px;
      justify-content: center;
    }
    .title-btn {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(200,160,255,0.75);
      background: rgba(20,10,40,0.55);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(160,80,255,0.30);
      border-radius: 8px;
      padding: 12px 28px;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }
    .title-btn:hover {
      color: rgba(230,190,255,1.0);
      border-color: rgba(160,80,255,0.70);
      background: rgba(60,20,100,0.50);
    }
    .title-btn.primary {
      color: rgba(230,190,255,0.95);
      border-color: rgba(160,80,255,0.55);
    }

    /* ── Realm navigation ── */
    .realm-nav-row {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      justify-content: center;
    }
    .realm-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      max-width: 440px;
    }
    .realm-label {
      font-family: var(--font-eerie);
      font-size: 1.85rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      color: #d4aaff;
      text-align: center;
      margin-top: 20px;
      text-shadow:
        0 0 12px rgba(180,100,255,0.95),
        0 0 28px rgba(140,60,220,0.70),
        0 0 60px rgba(120,40,200,0.40),
        0 0 100px rgba(100,20,180,0.20);
      animation: realm-glow-pulse 4s ease-in-out infinite alternate;
    }
    @keyframes realm-glow-pulse {
      from { text-shadow: 0 0 10px rgba(180,100,255,0.85), 0 0 24px rgba(140,60,220,0.55), 0 0 50px rgba(120,40,200,0.30); }
      to   { text-shadow: 0 0 18px rgba(200,120,255,1.00), 0 0 40px rgba(160,80,255,0.80), 0 0 80px rgba(140,50,220,0.50), 0 0 120px rgba(100,20,180,0.25); }
    }
    .realm-arrow {
      background: rgba(20,10,40,0.50);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(160,80,255,0.25);
      border-radius: 50%;
      width: 44px;
      height: 44px;
      font-size: 1.6rem;
      color: rgba(200,160,255,0.75);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
      flex-shrink: 0;
      line-height: 1;
    }
    .realm-arrow:hover {
      color: rgba(230,190,255,1.0);
      border-color: rgba(160,80,255,0.60);
      background: rgba(60,20,100,0.50);
    }
    .realm-arrow-hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* ── How-to-play screen ── */
    .howto-screen {
      max-width: 520px;
      margin: 0 auto;
      padding: 8px 24px 48px;
    }
    .howto-section { margin-bottom: 28px; }
    .howto-label {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(160,80,255,0.70);
      margin-bottom: 8px;
    }
    .howto-rule {
      font-family: var(--font-eerie);
      font-style: italic;
      font-size: 1.05rem;
      color: rgba(210,185,255,0.90);
      line-height: 1.6;
      margin: 4px 0;
    }
    .howto-rule span {
      font-style: normal;
      font-family: var(--font-mono);
      font-size: 0.80rem;
    }
    .howto-rule .good  { color: #69ff47; }
    .howto-rule .warn  { color: #ffcc00; }
    .howto-rule .danger{ color: #ff4747; }
    .howto-rule .arcane{ color: #c070ff; }

    /* ── Keyboard key badge ── */
    .kbd {
      display: inline-block;
      font-family: var(--font-mono);
      font-style: normal;
      font-size: 0.72rem;
      color: #d0b8ff;
      background: rgba(100,50,200,0.18);
      border: 1px solid rgba(160,80,255,0.35);
      border-radius: 4px;
      padding: 1px 6px;
      letter-spacing: 0.04em;
      line-height: 1.6;
    }
    /* ── Key binding rows ── */
    .howto-keys {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 5px 14px;
      margin: 6px 0;
    }
    .howto-keys-action {
      font-family: var(--font-eerie);
      font-style: italic;
      font-size: 1.0rem;
      color: rgba(210,185,255,0.85);
      line-height: 1.6;
    }
    .howto-keys-keys { line-height: 1.6; }
    /* ── SFN notation token examples ── */
    .sfn-token {
      display: inline-block;
      font-family: var(--font-mono);
      font-style: normal;
      font-size: 0.80rem;
      color: #c8a8ff;
      background: rgba(80,30,160,0.25);
      border: 1px solid rgba(160,80,255,0.30);
      border-radius: 3px;
      padding: 1px 7px;
      margin: 1px 2px;
    }
    .sfn-token.hunter   { color: #ffcc00; border-color: rgba(255,200,0,0.35); }
    .sfn-token.cleanse  { color: #69ff47; border-color: rgba(105,255,71,0.35); }
    .sfn-token.fatal    { color: #ff4747; border-color: rgba(255,71,71,0.35); }
    .sfn-grid-legend {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3px 18px;
      margin: 8px 0 4px;
    }

    /* ── Sancta Forma logo ──────────────────────────────── */
    .sf-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    .sf-sigil {
      width: 160px;
      height: 146px;
      animation: sf-sigil-spin 90s linear infinite,
                 sf-sigil-pulse 4s ease-in-out infinite alternate;
      filter: drop-shadow(0 0 8px rgba(160,80,255,0.5));
    }
    @keyframes sf-sigil-spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    @keyframes sf-sigil-pulse {
      from { filter: drop-shadow(0 0 6px rgba(160,80,255,0.40)); }
      to   { filter: drop-shadow(0 0 18px rgba(160,80,255,0.80)); }
    }

    .sf-title {
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 1;
      margin-top: -8px;
      gap: 2px;
    }
    .sf-sancta {
      font-family: 'Cinzel Decorative', serif;
      font-size: 1.05rem;
      font-weight: 400;
      letter-spacing: 0.45em;
      color: #c8a8ff;
      text-shadow:
        0 0 12px rgba(180,100,255,0.90),
        0 0 28px rgba(140,60,220,0.60),
        0 0 55px rgba(120,40,200,0.30);
      animation: sf-flicker 6s infinite;
    }
    .sf-forma {
      font-family: 'Cinzel Decorative', serif;
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 0.18em;
      color: #f0e8ff;
      text-shadow:
        0 0 10px rgba(200,160,255,1.0),
        0 0 30px rgba(160,80,255,0.70),
        0 0 70px rgba(120,40,220,0.40),
        0 2px 4px rgba(0,0,0,0.8);
      animation: sf-flicker 6s infinite 0.4s;
    }
    @keyframes sf-flicker {
      0%,100% { opacity: 1; }
      88%  { opacity: 1; }
      89%  { opacity: 0.55; }
      90%  { opacity: 1; }
      93%  { opacity: 0.75; }
      94%  { opacity: 1; }
    }

    .sf-tagline {
      font-family: var(--font-eerie);
      font-size: clamp(0.95rem, 2.2vw, 1.25rem);
      letter-spacing: 0.28em;
      color: rgba(210,170,255,0.90);
      margin-top: 10px;
      text-transform: uppercase;
      text-shadow:
        0 0 10px rgba(160,80,255,0.80),
        0 0 28px rgba(130,50,240,0.55),
        0 0 55px rgba(100,30,200,0.30);
      animation: tagline-breathe 4s ease-in-out infinite alternate;
    }
    @keyframes tagline-breathe {
      from {
        text-shadow:
          0 0 8px  rgba(160,80,255,0.70),
          0 0 22px rgba(130,50,240,0.45),
          0 0 45px rgba(100,30,200,0.22);
        opacity: 0.85;
      }
      to {
        text-shadow:
          0 0 14px rgba(180,100,255,0.95),
          0 0 36px rgba(150,60,255,0.70),
          0 0 70px rgba(120,40,220,0.45);
        opacity: 1;
      }
    }

    .level-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .level-card {
      background: rgba(10, 8, 22, 0.82);
      backdrop-filter: blur(6px);
      border: 1px solid var(--border2);
      border-radius: 10px;
      padding: 20px 12px;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      position: relative;
      overflow: hidden;
    }
    .level-card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 9px;
      box-shadow: inset 0 0 0 1px var(--elem-color);
      opacity: 0;
      transition: opacity 0.15s;
    }
    .level-card:not(.locked):hover::before { opacity: 0.5; }
    .level-card:not(.locked):hover { transform: translateY(-2px); background: #1c2330; }
    .level-card.locked { opacity: 0.4; cursor: default; }
    .level-card.completed {
      border-color: #39ff6a;
      box-shadow: 0 0 10px rgba(57,255,106,0.45), 0 0 28px rgba(57,255,106,0.20);
    }
    .level-card.unlocked-unplayed {
      border-color: rgba(40, 80, 200, 0.7);
      box-shadow: 0 0 10px rgba(30,60,220,0.50), 0 0 30px rgba(20,40,180,0.28), inset 0 0 12px rgba(20,40,180,0.12);
    }
    .level-card.ls-focused:not(.locked) {
      transform: translateY(-2px);
      background: #1c2330;
      border-color: var(--elem-color, rgba(160,80,255,0.8));
      box-shadow: 0 0 0 2px var(--elem-color, rgba(140,60,220,0.7)), 0 0 18px rgba(140,60,220,0.35);
    }
    .level-card.ls-focused:not(.locked)::before { opacity: 0.5; }

    .card-rite {
      font-family: var(--font-mono);
      font-size: 0.58rem;
      letter-spacing: 0.22em;
      color: var(--text-dim);
      text-transform: uppercase;
    }
    .card-num {
      font-family: var(--font-eerie);
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--elem-color, var(--text));
      text-shadow: 0 0 12px var(--elem-color, rgba(180,120,255,0.6));
    }
    .card-elem {
      font-family: var(--font-mono);
      font-size: 0.62rem;
      letter-spacing: 0.14em;
      color: var(--text-dim);
    }
    .card-status { font-size: 1rem; line-height: 1; }
    .card-status svg { display: block; }

    /* ── Game Layout ──────────────────────────────────── */
    .game-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 12px;
    }

    /* ── HUD ──────────────────────────────────────────── */
    .hud {
      width: 100%;
      max-width: 400px;
      background: rgba(6, 4, 16, 0.82);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(120,60,220,0.30);
      box-shadow: 0 0 24px rgba(80,30,180,0.20), inset 0 0 30px rgba(60,20,140,0.08);
      border-radius: 10px;
      padding: 10px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .hud-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .hud-top {
      justify-content: space-between;
    }
    .hud-level {
      font-family: var(--font-eerie);
      font-size: 0.68rem;
      color: var(--arcane);
      letter-spacing: 0.12em;
      text-shadow: 0 0 8px rgba(140,80,255,0.5);
    }
    .hud-back { font-size: 0.70rem; padding: 3px 8px; }

    /* Identity panel — YOUR FORM → CORRUPTED STATE */
    .hud-identity {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(60,30,120,0.08);
      border: 1px solid rgba(120,60,220,0.20);
      border-radius: 6px;
      padding: 8px 10px;
      position: relative;
    }
    .hud-identity::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 5px;
      background: linear-gradient(135deg, rgba(100,50,200,0.04), transparent);
      pointer-events: none;
    }
    .hud-identity-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      flex: 1;
    }
    .hud-identity-label {
      font-family: var(--font-eerie);
      font-size: 0.50rem;
      color: rgba(200, 170, 255, 0.75);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .hud-identity-shape {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .hud-origin-name, .hud-current-name {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: bold;
      letter-spacing: 0.08em;
    }
    .hud-identity-arrow {
      font-size: 1rem;
      color: #3d4d5e;
      transition: color 0.3s;
      flex-shrink: 0;
    }

    /* Stats row */
    .hud-stats-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .hud-stat {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .hud-stat-right { align-items: flex-end; }
    .hud-stat-label {
      font-family: var(--font-eerie);
      font-size: 0.50rem;
      color: rgba(200, 170, 255, 0.75);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .hud-corruption {
      font-family: var(--font-mono);
      font-size: 0.90rem;
      font-weight: bold;
    }
    .hud-score {
      font-family: var(--font-mono);
      font-size: 0.90rem;
      font-weight: bold;
      color: var(--text);
    }

    /* ── SFN Trace strip ──────────────────────────────────── */
    .hud-trace {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 2px;
      padding: 7px 10px;
      background: rgba(60, 30, 120, 0.06);
      border: 1px solid rgba(120, 60, 220, 0.18);
      border-radius: 6px;
      min-height: 30px;
    }
    .hud-trace-label {
      font-family: var(--font-eerie);
      font-style: italic;
      font-size: 0.62rem;
      color: var(--arcane-dim);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      flex-shrink: 0;
    }
    .hud-trace-strip {
      flex: 1;
      font-family: var(--font-mono);
      font-size: 0.74rem;
      color: var(--text-dim);
      letter-spacing: 0.03em;
      overflow-y: auto;
      white-space: normal;
      word-break: break-all;
      max-height: 120px;
      scrollbar-width: thin;
      scrollbar-color: rgba(120, 60, 220, 0.3) transparent;
      padding: 1px 0;
    }
    .hud-trace-strip::-webkit-scrollbar { width: 3px; }
    .hud-trace-strip::-webkit-scrollbar-track { background: transparent; }
    .hud-trace-strip::-webkit-scrollbar-thumb {
      background: rgba(120, 60, 220, 0.3);
      border-radius: 2px;
    }
    .hud-trace-strip .move          { margin-right: 9px; }
    .hud-trace-strip .move-latest   {
      color: var(--arcane);
      text-shadow: 0 0 8px rgba(140, 80, 255, 0.55);
    }
    .hud-trace-strip .move-shift    {
      color: var(--arcane-dim);
      font-style: italic;
      opacity: 0.75;
    }
    .hud-trace-strip .move-outcome-win {
      color: var(--green);
      font-weight: bold;
      text-shadow: 0 0 8px rgba(105, 255, 71, 0.55);
      margin-left: 6px;
    }
    .hud-trace-strip .move-outcome-loss {
      color: var(--red);
      font-weight: bold;
      text-shadow: 0 0 8px rgba(255, 71, 71, 0.55);
      margin-left: 6px;
    }
    .hud-trace-strip .empty-state {
      color: var(--arcane-dim);
      font-style: italic;
      opacity: 0.5;
      font-family: var(--font-eerie);
      font-size: 0.78rem;
    }

    /* ── Grid SVG — fills available space below logo ──────── */
    .game-grid {
      /* Square: constrained by both width and remaining height */
      width:      min(92vw, calc(100dvh - var(--logo-h, 240px) - 140px));
      max-width:  400px;
      height: auto;
      display: block;
      border-radius: 8px;
      border: 1px solid rgba(50,30,90,0.40);
      background: transparent;
    }

    /* ── Global fixed logo — always top-centre, never moves ─── */
    #global-logo {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      z-index: 60;
      pointer-events: auto;
      cursor: pointer;
      text-align: center;
      padding-top: clamp(4px, 1vh, 10px);
      transition: opacity 0.15s;
    }
    #global-logo:hover { opacity: 0.8; }
    #global-logo .sf-sigil {
      width:   clamp(80px,  20vmin, 160px);
      height:  clamp(73px,  18vmin, 146px);
      display: block;
      margin: 0 auto;
    }
    #global-logo .sf-title {
      margin-top: 2px;
      line-height: 1.05;
    }
    #global-logo .sf-sancta {
      font-size: clamp(0.55rem, 1.4vmin, 0.95rem);
      letter-spacing: 0.30em;
    }
    #global-logo .sf-forma {
      font-size: clamp(1.1rem, 3.2vmin, 1.9rem);
      letter-spacing: 0.18em;
    }
    #dev-badge {
      margin-top: 5px;
      font-family: monospace;
      font-size: clamp(0.55rem, 1.3vmin, 0.78rem);
      letter-spacing: 0.18em;
      color: rgba(255, 200, 60, 0.9);
      text-shadow: 0 0 8px rgba(255,160,0,0.7), 0 0 2px #000;
      animation: devPulse 2.8s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes devPulse {
      0%, 100% { opacity: 0.7; }
      50%       { opacity: 1.0; }
    }

    /* ── Costumed player pulse ─────────────────────────────── */
    .player-costumed {
      animation: costume-pulse 0.7s ease-in-out infinite alternate;
    }
    @keyframes costume-pulse {
      from { filter: drop-shadow(0 0 6px rgba(255,80,20,0.5)); }
      to   { filter: drop-shadow(0 0 18px rgba(255,80,20,1.0)); }
    }

    /* ── Valid-move hint pulse ─────────────────────────────── */
    .move-hint-pulse {
      animation: hint-pulse 1.2s ease-in-out infinite alternate;
    }
    @keyframes hint-pulse {
      from { opacity: 0.5; }
      to   { opacity: 1.0; }
    }

    /* ── Transform hint toast ─────────────────────────────── */
    #transform-hint {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      background: rgba(180, 20, 20, 0.88);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,80,80,0.50);
      border-radius: 8px;
      padding: 8px 18px;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      color: #ffcccc;
      text-transform: uppercase;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease;
      white-space: nowrap;
    }
    #transform-hint.visible { opacity: 1; }

    /* ── Realm Quick-Nav Strip (title screen) ── */
    .realm-qnav {
      width: 100%;
      max-width: 420px;
      margin-top: 28px;
      overflow: visible;
    }
    .realm-qnav-inner {
      display: flex;
      justify-content: center;
      gap: 5px;
      overflow-x: auto;
      overflow-y: visible;
      scrollbar-width: none;
      padding: 2px 4px 40px;
      margin-bottom: -40px;
    }
    .realm-qnav-inner::-webkit-scrollbar { display: none; }
    .realm-qnav-thumb {
      flex-shrink: 0;
      width: 52px;
      height: 38px;
      border-radius: 4px;
      background-size: cover;
      background-position: center;
      opacity: 0.38;
      border: 1px solid rgba(255,255,255,0.10);
      cursor: pointer;
      transition: opacity 0.2s, border-color 0.2s, transform 0.18s;
      position: relative;
    }
    .realm-qnav-thumb:hover {
      opacity: 0.82;
      border-color: rgba(150,100,255,0.55);
      transform: translateY(-3px);
    }
    .realm-qnav-label {
      position: absolute;
      bottom: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      background: rgba(6,3,18,0.93);
      border: 1px solid rgba(100,60,200,0.35);
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 0.62rem;
      color: rgba(195,170,255,0.88);
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
      letter-spacing: 0.09em;
      font-family: var(--font-eerie);
    }
    .realm-qnav-thumb:hover .realm-qnav-label { opacity: 1; }

    /* ── Lore overlay — narrative fades over the background ── */
    #lore-overlay {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    #lore-overlay p {
      font-family: var(--font-eerie);
      font-style: italic;
      font-size: 1.55rem;
      font-weight: 400;
      color: rgba(255, 240, 255, 1.0);
      text-align: center;
      max-width: 520px;
      line-height: 1.6;
      letter-spacing: 0.04em;
      /* Dark pill backdrop for legibility */
      background: rgba(3, 1, 12, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(180, 100, 255, 0.35);
      border-radius: 12px;
      padding: 20px 36px;
      text-shadow:
        0 0 12px rgba(200, 130, 255, 0.90),
        0 0 32px rgba(160,  80, 255, 0.55),
        0 1px 3px rgba(0, 0, 0, 1.0);
      box-shadow: 0 0 40px rgba(100, 40, 200, 0.25), 0 4px 24px rgba(0,0,0,0.6);
      opacity: 0;
      transition: opacity 1.1s ease;
      margin: 0;
    }

    /* ── In-game logo spacer (actual logo is #global-logo fixed) ── */
    .game-logo-wrap {
      width: 100%;
    }

    /* ── D-Pad ──────────────────────────────────────────── */
    .dpad {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      user-select: none;
    }
    .dpad-row {
      display: flex;
      gap: 4px;
    }
    .dpad-btn {
      width: 52px;
      height: 52px;
      background: rgba(20,10,45,0.40);
      border: 1px solid var(--border2);
      border-radius: 6px;
      color: var(--arcane-dim);
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.10s;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 8px rgba(80,40,160,0.12);
    }
    .dpad-btn:active, .dpad-btn:focus-visible {
      background: rgba(60,20,120,0.70);
      border-color: var(--arcane);
      color: var(--arcane);
      box-shadow: 0 0 12px rgba(120,60,255,0.40);
      outline: none;
    }
    .dpad-center {
      background: transparent;
      border-color: transparent;
      cursor: default;
      color: rgba(80,50,120,0.40);
      font-size: 0.6rem;
      box-shadow: none;
    }

    /* ── Overlay (win/lose) ─────────────────────────────── */
    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      z-index: 25;
      pointer-events: none;
    }
    .overlay-box {
      pointer-events: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 32px 28px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      max-width: 300px;
    }
    .overlay-win .overlay-box   {
      border-color: #6a3fff;
      background: rgba(8,4,22,0.97);
      box-shadow: 0 0 40px rgba(100,60,255,0.25), inset 0 0 30px rgba(80,40,200,0.08);
    }
    .overlay-lose .overlay-box  {
      border-color: #4a2880;
      background: rgba(6,4,18,0.97);
      box-shadow: 0 0 30px rgba(80,30,160,0.20), inset 0 0 20px rgba(60,20,120,0.10);
    }
    .overlay-death .overlay-box {
      border-color: #880000;
      background: rgba(12, 4, 4, 0.96);
      box-shadow: 0 0 40px rgba(180,0,0,0.35), inset 0 0 30px rgba(100,0,0,0.15);
    }

    .overlay-icon {
      font-size: 2.4rem;
      line-height: 1;
    }
    .overlay-win .overlay-icon  { color: var(--green); }
    .overlay-lose .overlay-icon { color: var(--red); }

    .overlay-box h2 {
      font-size: 1.1rem;
      letter-spacing: 0.14em;
      font-family: var(--font-eerie);
    }
    .eerie-h2 {
      font-family: var(--font-eerie) !important;
      font-size: 1.1rem;
      letter-spacing: 0.14em;
      color: #c8a8ff;
      text-shadow: 0 0 14px rgba(160,80,255,0.7);
      text-align: center;
      line-height: 1.3;
    }
    .win-sub-title {
      display: block;
      font-size: 0.65em;
      letter-spacing: 0.30em;
      color: rgba(200,170,255,0.60);
    }
    .win-icon {
      color: var(--arcane) !important;
      text-shadow: 0 0 20px rgba(140,80,255,0.9);
      animation: win-pulse 1.8s ease-in-out infinite;
    }
    @keyframes win-pulse {
      0%,100% { transform: scale(1);    opacity: 1; }
      50%      { transform: scale(1.15); opacity: 0.8; }
    }
    /* ── Bound animation ── */
    .bound-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .bound-anim {
      width: 130px;
      height: 130px;
      overflow: visible;
    }
    .bh-ring {
      fill: none;
      transform-box: fill-box;
      transform-origin: center;
    }
    .bh-ring-1 {
      stroke: rgba(100,50,180,0.80);
      stroke-width: 1.4;
      stroke-dasharray: 300;
      stroke-dashoffset: 300;
      animation: bh-draw 0.9s 0.1s ease-out forwards, bh-spin-cw 18s linear 1.0s infinite;
    }
    .bh-ring-2 {
      stroke: rgba(140,70,220,0.65);
      stroke-width: 1.0;
      stroke-dasharray: 230;
      stroke-dashoffset: 230;
      animation: bh-draw 0.8s 0.5s ease-out forwards, bh-spin-ccw 13s linear 1.3s infinite;
    }
    .bh-ring-3 {
      stroke: rgba(180,100,255,0.55);
      stroke-width: 0.7;
      stroke-dasharray: 160;
      stroke-dashoffset: 160;
      animation: bh-draw 0.7s 0.9s ease-out forwards, bh-spin-cw 9s linear 1.6s infinite;
    }
    .bh-spoke {
      stroke: rgba(160,80,240,0.28);
      stroke-width: 0.6;
      stroke-dasharray: 50;
      stroke-dashoffset: 50;
    }
    .bh-spoke-1 { animation: bh-draw 0.5s 1.4s ease-out forwards; }
    .bh-spoke-2 { animation: bh-draw 0.5s 1.5s ease-out forwards; }
    .bh-spoke-3 { animation: bh-draw 0.5s 1.6s ease-out forwards; }
    .bh-spoke-4 { animation: bh-draw 0.5s 1.7s ease-out forwards; }
    .bh-spoke-5 { animation: bh-draw 0.5s 1.8s ease-out forwards; }
    .bh-spoke-6 { animation: bh-draw 0.5s 1.9s ease-out forwards; }
    .bh-dot {
      fill: rgba(180,100,255,0.0);
      animation: bh-dot-in 0.4s 2.0s ease-out forwards, bh-dot-pulse 2.8s 2.4s ease-in-out infinite;
    }
    @keyframes bh-draw    { to { stroke-dashoffset: 0; } }
    @keyframes bh-spin-cw  { to { transform: rotate(360deg);  } }
    @keyframes bh-spin-ccw { to { transform: rotate(-360deg); } }
    @keyframes bh-dot-in {
      to { fill: rgba(180,100,255,0.65); }
    }
    @keyframes bh-dot-pulse {
      0%,100% { fill: rgba(180,100,255,0.55); filter: drop-shadow(0 0 2px rgba(180,100,255,0.4)); }
      50%     { fill: rgba(200,130,255,0.85); filter: drop-shadow(0 0 8px rgba(180,100,255,0.9)); }
    }
    .bound-title {
      font-family: var(--font-mono);
      font-size: 2rem;
      letter-spacing: 0.9em;
      padding-right: 0.9em; /* keep centered during animation */
      color: #7030b0;
      text-shadow: 0 0 14px rgba(120,40,200,0.8), 0 0 32px rgba(100,20,180,0.4);
      opacity: 0;
      animation: bound-compress 1.6s 1.0s ease-out forwards;
    }
    @keyframes bound-compress {
      0%   { opacity: 0; letter-spacing: 0.9em; filter: blur(6px); color: #a060e0; }
      40%  { opacity: 0.8; letter-spacing: 0.35em; filter: blur(1px); }
      100% { opacity: 1;   letter-spacing: 0.22em; filter: blur(0);   color: #8040c0; }
    }
    .bound-icon {
      color: #5a3080 !important;
      font-size: 2rem !important;
    }
    .overlay-score {
      font-family: var(--font-mono);
      font-size: 0.9rem;
      color: var(--text-dim);
    }
    .overlay-reason {
      font-size: 0.85rem;
      color: var(--red);
      font-family: var(--font-mono);
    }
    .overlay-sub {
      font-size: 0.85rem;
      color: var(--green);
      font-family: var(--font-mono);
    }

    /* ── Death overlay ──────────────────────────────────── */
    .death-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .death-dissolve {
      position: relative;
      width: 180px;
      height: 200px;
      margin: 0 auto 4px;
    }
    /* Heat glow at the source — dim ember bed at bottom */
    .death-dissolve .d-base {
      position: absolute;
      left: 50%; bottom: 8px;
      width: 90px; height: 28px;
      margin-left: -45px;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(255,60,10,0.55) 0%, rgba(180,0,0,0.25) 55%, transparent 100%);
      filter: blur(8px);
      animation: d-base-pulse 2.2s ease-in-out infinite;
    }
    @keyframes d-base-pulse {
      0%,100% { opacity: 0.7; transform: scaleX(1); }
      50%     { opacity: 1.0; transform: scaleX(1.15); }
    }
    /* Smoke puffs — continuous rise, staggered across 2.8s period */
    .death-dissolve .d-puff {
      position: absolute;
      border-radius: 55% 45% 60% 40% / 50% 60% 40% 55%;
      background: radial-gradient(ellipse at 38% 42%,
        rgba(220,30,10,0.72) 0%,
        rgba(160,0,0,0.42)   42%,
        rgba(80,0,0,0.12)    72%,
        transparent          100%);
      filter: blur(10px);
    }
    .death-dissolve .d-puff:nth-child(2) {
      width: 100px; height: 90px;
      left: 50%; bottom: 12px; margin-left: -50px;
      animation: d-smoke-c 2.8s ease-out infinite 0.0s;
    }
    .death-dissolve .d-puff:nth-child(3) {
      width: 80px; height: 82px;
      left: 28%; bottom: 10px;
      border-radius: 60% 40% 52% 48% / 48% 56% 44% 52%;
      animation: d-smoke-l 2.8s ease-out infinite 0.7s;
    }
    .death-dissolve .d-puff:nth-child(4) {
      width: 85px; height: 88px;
      left: 46%; bottom: 8px;
      border-radius: 48% 58% 42% 56% / 58% 42% 56% 44%;
      animation: d-smoke-r 2.8s ease-out infinite 1.4s;
    }
    .death-dissolve .d-puff:nth-child(5) {
      width: 65px; height: 72px;
      left: 38%; bottom: 10px;
      background: radial-gradient(ellipse at 44% 48%,
        rgba(190,20,5,0.50) 0%,
        rgba(110,0,0,0.22)  52%,
        transparent         100%);
      filter: blur(14px);
      animation: d-smoke-c 2.8s ease-out infinite 2.1s;
    }
    /* Ember sparks — tiny dots that thread upward through the smoke */
    .death-dissolve .d-ember {
      position: absolute;
      width: 4px; height: 4px;
      border-radius: 50%;
      background: rgba(255,120,40,0.9);
      filter: drop-shadow(0 0 3px rgba(255,80,10,1));
    }
    .death-dissolve .d-ember:nth-child(6) {
      left: 52%; bottom: 18px;
      animation: d-ember-rise 2.2s ease-out infinite 0.3s;
    }
    .death-dissolve .d-ember:nth-child(7) {
      left: 42%; bottom: 14px;
      width: 3px; height: 3px;
      animation: d-ember-rise-l 2.6s ease-out infinite 1.1s;
    }
    .death-dissolve .d-ember:nth-child(8) {
      left: 58%; bottom: 16px;
      width: 3px; height: 3px;
      animation: d-ember-rise-r 2.0s ease-out infinite 1.9s;
    }
    .death-dissolve .d-ember:nth-child(9) {
      left: 47%; bottom: 20px;
      width: 2px; height: 2px;
      background: rgba(255,180,60,0.95);
      animation: d-ember-rise 1.8s ease-out infinite 0.0s;
    }
    .death-dissolve .d-ember:nth-child(10) {
      left: 62%; bottom: 12px;
      width: 3px; height: 3px;
      animation: d-ember-rise-l 2.4s ease-out infinite 0.55s;
    }
    .death-dissolve .d-ember:nth-child(11) {
      left: 38%; bottom: 22px;
      width: 2px; height: 2px;
      background: rgba(255,160,50,0.9);
      animation: d-ember-rise-r 2.9s ease-out infinite 1.6s;
    }
    .death-dissolve .d-ember:nth-child(12) {
      left: 55%; bottom: 10px;
      width: 2px; height: 2px;
      animation: d-ember-rise 2.1s ease-out infinite 2.3s;
    }
    @keyframes d-smoke-c {
      0%   { transform: scale(0.25) translateY(0);      opacity: 0;   filter: blur(10px); }
      12%  { transform: scale(0.65) translateY(-8px);   opacity: 0.85; }
      45%  { transform: scale(1.10) translateY(-52px);  opacity: 0.65; filter: blur(12px); }
      75%  { transform: scale(1.45) translateY(-100px); opacity: 0.22; filter: blur(20px); }
      90%  { transform: scale(1.65) translateY(-138px); opacity: 0;   filter: blur(28px); }
      100% { transform: scale(0.25) translateY(0);      opacity: 0;   filter: blur(10px); }
    }
    @keyframes d-smoke-l {
      0%   { transform: scale(0.2) translate(0, 0);           opacity: 0;    filter: blur(10px); }
      12%  { transform: scale(0.6) translate(-4px, -6px);     opacity: 0.80; }
      45%  { transform: scale(1.0) translate(-22px, -50px);   opacity: 0.58; filter: blur(13px); }
      75%  { transform: scale(1.3) translate(-42px, -96px);   opacity: 0.18; filter: blur(22px); }
      90%  { transform: scale(1.5) translate(-56px, -130px);  opacity: 0;    filter: blur(30px); }
      100% { transform: scale(0.2) translate(0, 0);           opacity: 0;    filter: blur(10px); }
    }
    @keyframes d-smoke-r {
      0%   { transform: scale(0.2) translate(0, 0);           opacity: 0;    filter: blur(10px); }
      12%  { transform: scale(0.6) translate(5px, -7px);      opacity: 0.82; }
      45%  { transform: scale(1.0) translate(24px, -54px);    opacity: 0.60; filter: blur(13px); }
      75%  { transform: scale(1.3) translate(44px, -98px);    opacity: 0.20; filter: blur(22px); }
      90%  { transform: scale(1.5) translate(58px, -132px);   opacity: 0;    filter: blur(30px); }
      100% { transform: scale(0.2) translate(0, 0);           opacity: 0;    filter: blur(10px); }
    }
    @keyframes d-ember-rise {
      0%   { transform: translateY(0)   scaleY(1);   opacity: 0.9; }
      60%  { transform: translateY(-80px) scaleY(2); opacity: 0.6; }
      100% { transform: translateY(-150px) scaleY(1); opacity: 0; }
    }
    @keyframes d-ember-rise-l {
      0%   { transform: translate(0,0)         scaleY(1);   opacity: 0.85; }
      60%  { transform: translate(-12px,-70px) scaleY(2.5); opacity: 0.5;  }
      100% { transform: translate(-20px,-140px) scaleY(1);  opacity: 0; }
    }
    @keyframes d-ember-rise-r {
      0%   { transform: translate(0,0)          scaleY(1);   opacity: 0.85; }
      60%  { transform: translate(10px,-75px)   scaleY(2);   opacity: 0.55; }
      100% { transform: translate(18px,-145px)  scaleY(1);   opacity: 0; }
    }
    /* Shape shards — tiny squares, circles, triangles fragmenting outward */
    .d-shard {
      position: absolute;
      left: 50%; bottom: 30px;
      opacity: 0;
      pointer-events: none;
    }
    .d-shard.sq {
      width: 7px; height: 7px;
      margin-left: -3px;
      background: #00e5ff;
      box-shadow: 0 0 6px rgba(0,229,255,0.9);
    }
    .d-shard.ci {
      width: 7px; height: 7px;
      margin-left: -3px;
      border-radius: 50%;
      background: #e040fb;
      box-shadow: 0 0 6px rgba(224,64,251,0.9);
    }
    .d-shard.tr {
      width: 0; height: 0;
      margin-left: -4px;
      background: none;
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-bottom: 8px solid #69ff47;
      filter: drop-shadow(0 0 4px rgba(105,255,71,0.9));
    }
    /* 9 shards flying in different directions */
    .d-shard:nth-child(13) { animation: d-shard-a 1.6s ease-out infinite 0.1s; }
    .d-shard:nth-child(14) { animation: d-shard-b 1.8s ease-out infinite 0.5s; }
    .d-shard:nth-child(15) { animation: d-shard-c 1.5s ease-out infinite 0.9s; }
    .d-shard:nth-child(16) { animation: d-shard-d 1.9s ease-out infinite 0.2s; }
    .d-shard:nth-child(17) { animation: d-shard-e 1.4s ease-out infinite 0.7s; }
    .d-shard:nth-child(18) { animation: d-shard-f 1.7s ease-out infinite 1.1s; }
    .d-shard:nth-child(19) { animation: d-shard-a 1.6s ease-out infinite 1.4s; }
    .d-shard:nth-child(20) { animation: d-shard-d 1.5s ease-out infinite 0.3s; }
    .d-shard:nth-child(21) { animation: d-shard-c 1.8s ease-out infinite 0.8s; }
    @keyframes d-shard-a {
      0%   { transform: translate(0,0) rotate(0deg);          opacity: 0; }
      8%   { opacity: 1; }
      100% { transform: translate(-55px,-90px) rotate(-180deg); opacity: 0; }
    }
    @keyframes d-shard-b {
      0%   { transform: translate(0,0) rotate(0deg);          opacity: 0; }
      8%   { opacity: 1; }
      100% { transform: translate(60px,-85px) rotate(220deg);  opacity: 0; }
    }
    @keyframes d-shard-c {
      0%   { transform: translate(0,0) rotate(0deg);          opacity: 0; }
      8%   { opacity: 1; }
      100% { transform: translate(-30px,-110px) rotate(150deg); opacity: 0; }
    }
    @keyframes d-shard-d {
      0%   { transform: translate(0,0) rotate(0deg);           opacity: 0; }
      8%   { opacity: 1; }
      100% { transform: translate(40px,-100px) rotate(-240deg); opacity: 0; }
    }
    @keyframes d-shard-e {
      0%   { transform: translate(0,0) rotate(0deg);           opacity: 0; }
      8%   { opacity: 1; }
      100% { transform: translate(-70px,-60px) rotate(300deg);  opacity: 0; }
    }
    @keyframes d-shard-f {
      0%   { transform: translate(0,0) rotate(0deg);          opacity: 0; }
      8%   { opacity: 1; }
      100% { transform: translate(65px,-70px) rotate(-130deg); opacity: 0; }
    }
    /* Idle lore — realm narrative lines that fade in below level select buttons */
    .ls-idle-lore {
      position: absolute;
      bottom: 26%;
      left: 50%;
      transform: translateX(-50%);
      width: min(420px, 86vw);
      text-align: center;
      font-family: var(--font-eerie);
      font-size: clamp(1.05rem, 3.5vw, 1.35rem);
      font-style: italic;
      letter-spacing: 0.04em;
      line-height: 1.65;
      color: rgba(212, 170, 255, 0.0);
      text-shadow:
        0 0 8px  rgba(180, 120, 255, 0.0),
        0 0 24px rgba(160,  80, 255, 0.0),
        0 0 55px rgba(140,  50, 240, 0.0);
      transition: color 1.4s ease, text-shadow 1.4s ease;
      pointer-events: none;
      white-space: normal;
    }
    .ls-idle-lore.visible {
      color: rgba(220, 185, 255, 0.88);
      text-shadow:
        0 0 8px  rgba(200, 140, 255, 0.95),
        0 0 24px rgba(170,  90, 255, 0.75),
        0 0 55px rgba(140,  50, 240, 0.50),
        0 0 90px rgba(120,  30, 220, 0.30);
    }
    /* Fog layers in front of the text */
    .ls-idle-lore::before,
    .ls-idle-lore::after {
      content: '';
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.6s ease;
    }
    /* Wide soft fog halo behind/around text */
    .ls-idle-lore::before {
      width: 160%; height: 220%;
      background: radial-gradient(ellipse,
        rgba(80, 20, 140, 0.28) 0%,
        rgba(60, 10, 120, 0.14) 45%,
        transparent 75%);
      filter: blur(18px);
      z-index: -1;
    }
    /* Closer wispy fog that partially occludes the edges */
    .ls-idle-lore::after {
      width: 130%; height: 170%;
      background: radial-gradient(ellipse,
        transparent 30%,
        rgba(30, 5, 80, 0.22) 60%,
        rgba(20, 0, 60, 0.38) 100%);
      filter: blur(12px);
      z-index: 1;
    }
    .ls-idle-lore.visible::before,
    .ls-idle-lore.visible::after {
      opacity: 1;
    }
    .death-title {
      font-family: var(--font-mono);
      font-size: 2rem !important;
      letter-spacing: 0.25em !important;
      color: #ff2222 !important;
      text-shadow: 0 0 18px rgba(255,30,30,0.9), 0 0 40px rgba(200,0,0,0.5);
      animation: death-flicker 3.5s infinite;
    }
    @keyframes death-flicker {
      0%,100% { opacity: 1; }
      92%     { opacity: 1; }
      93%     { opacity: 0.4; }
      94%     { opacity: 1; }
      96%     { opacity: 0.6; }
      97%     { opacity: 1; }
    }
    .death-sub {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: #883333;
      letter-spacing: 0.08em;
    }
    .btn-danger {
      background: #880000;
      color: #ffcccc;
      border: 1px solid #cc0000;
      border-radius: 8px;
      padding: 10px 24px;
      font-family: var(--font-main);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.04em;
      transition: all 0.15s;
    }
    .btn-danger:hover { background: #aa0000; border-color: #ff2222; color: #fff; }

    /* ── Buttons ────────────────────────────────────────── */
    .btn-primary {
      background: linear-gradient(135deg, #3a1a80, #5a2aaa);
      color: #e0d0ff;
      border: 1px solid #6a3fff;
      border-radius: 6px;
      padding: 10px 20px;
      font-family: var(--font-eerie);
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.10em;
      text-shadow: 0 0 8px rgba(180,120,255,0.6);
      box-shadow: 0 0 16px rgba(100,50,220,0.30);
      transition: all 0.15s;
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #4a2a90, #7a3acc);
      box-shadow: 0 0 24px rgba(120,60,255,0.50);
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-dim);
      border: 1px solid var(--border2);
      border-radius: 6px;
      padding: 8px 18px;
      font-family: var(--font-eerie);
      font-size: 0.60rem;
      letter-spacing: 0.10em;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-ghost:hover { border-color: var(--arcane-dim); color: var(--arcane); }

    /* ── Narrative intro screen ────────────────────────── */
    .narrative-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      width: 100%;
    }
    .narrative-wrap {
      width: min(720px, 96vw);
      max-width: none;
      text-align: center;
      padding: 32px clamp(16px, 6vw, 40px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .narr-heading {
      font-family: var(--font-eerie);
      font-size: clamp(1.2rem, 5vw, 1.6rem);
      font-weight: 600;
      letter-spacing: 0.28em;
      color: #d4aaff;
      text-transform: uppercase;
      margin-bottom: 4px;
      text-shadow:
        0 0 12px rgba(180,100,255,0.95),
        0 0 28px rgba(140,60,220,0.70),
        0 0 60px rgba(120,40,200,0.40);
      animation: narr-heading-glow 4s ease-in-out infinite alternate;
    }
    @keyframes narr-heading-glow {
      from { text-shadow: 0 0 10px rgba(180,100,255,0.85), 0 0 24px rgba(140,60,220,0.55); }
      to   { text-shadow: 0 0 18px rgba(200,120,255,1.00), 0 0 40px rgba(160,80,255,0.80), 0 0 80px rgba(140,50,220,0.50); }
    }
    .narr-lines {
      display: flex;
      flex-direction: column;
      gap: 0.6em;
      width: 100%;
    }
    .narr-line {
      font-family: var(--font-eerie);
      font-size: clamp(0.88rem, 3.8vw, 1.12rem);
      font-style: italic;
      letter-spacing: 0.04em;
      line-height: 1.65;
      margin: 0;
      padding: 0;
      opacity: 0;
      animation: narr-line-in 2.2s cubic-bezier(0.16,1,0.3,1) forwards;
    }
    @keyframes narr-line-in {
      0% {
        opacity: 0;
        transform: translateY(20px);
        filter: blur(8px);
        text-shadow: 0 0 50px rgba(200,100,255,1.0), 0 0 100px rgba(160,50,230,0.8), 0 0 180px rgba(120,30,200,0.5);
        color: rgba(220,180,255,0.6);
      }
      30% {
        opacity: 0.85;
        transform: translateY(4px);
        filter: blur(1px);
        text-shadow: 0 0 24px rgba(180,80,255,0.7), 0 0 55px rgba(140,40,210,0.4);
        color: rgba(230,210,255,0.9);
      }
      65% {
        text-shadow: 0 0 12px rgba(150,60,220,0.35), 0 0 28px rgba(120,30,190,0.2);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
        text-shadow: 0 0 6px rgba(120,50,200,0.12);
        color: rgba(218,208,248,0.88);
      }
    }
    .narr-wrap-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      transition: opacity 0.7s ease, transform 0.7s ease;
    }
    .narr-wrap-inner.narr-exiting {
      opacity: 0 !important;
      transform: translateY(-16px) !important;
    }
    .narr-wrap-inner.narr-entering {
      opacity: 0;
      transform: translateY(12px);
    }
    .narr-wrap-inner.narr-entered {
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.6s ease 0.1s, transform 0.6s ease 0.1s;
    }
    .narr-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      opacity: 0;
      animation: narr-line-in 1.4s ease forwards;
      margin-top: 14px;
    }

    /* ── Floating narrative text (canvas layer handled in JS) ── */
    /* (no CSS needed — drawn directly on canvas) */

    /* ── Music button ──────────────────────────────────── */
    #music-btn {
      position: fixed;
      bottom: 18px;
      right: 18px;
      z-index: 50;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(22, 27, 34, 0.80);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.12);
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s, transform 0.15s;
      line-height: 1;
    }
    #music-btn:hover { border-color: var(--cyan); transform: scale(1.08); }

    /* ── Responsive ─────────────────────────────────────── */
    @media (max-width: 420px) {
      .screen-header h1 { font-size: 1.8rem; }
      .dpad-btn { width: 46px; height: 46px; }
    }
    /* Short screens (landscape phone) */
    @media (max-height: 600px) {
      .hud { padding: 6px 12px; gap: 3px; }
      .realm-label { font-size: 1.2rem; margin-top: 10px; }
    }
    /* Reduced-motion: skip animations, show text immediately */
    @media (prefers-reduced-motion: reduce) {
      .narr-line, .narr-actions {
        opacity: 1 !important;
        animation: none !important;
        transform: none !important;
        filter: none !important;
      }
      .narr-wrap-inner {
        opacity: 1 !important;
        transform: none !important;
        transition: none !important;
      }
    }

    /* ───────────────────────────────────────────────────────────────────────────
       Orientation-aware layout
       ─────────────────────────────────────────────────────────────────────────── */

    /* Portrait (default — existing behavior, do not change anything that wasn't
       already there). HUD sits below the grid. */
    @media (orientation: portrait) {
      .game-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      .game-wrapper > .game-grid {
        order: 2;
      }
      .game-wrapper > .hud {
        order: 3;
        width: 100%;
        max-width: 480px;
      }
      .game-wrapper > .game-logo-wrap {
        order: 1;
      }
    }

    /* Landscape — HUD sits to the right of the grid */
    @media (orientation: landscape) {
      .game-wrapper {
        display: flex;
        flex-direction: row;
        align-items: flex-start;
        justify-content: center;
        gap: 24px;
        padding: 16px;
        /* Push the entire wrapper below the fixed logo overlay. The logo's
           rendered height is exposed by index.html as --logo-offset (set by
           syncLogoH()); fallback 180px if unset. */
        padding-top: calc(var(--logo-offset, 180px) + 8px);
        /* Constrain so wide screens don't sprawl */
        max-width: 1400px;
        margin: 0 auto;
      }
      .game-wrapper > .game-logo-wrap {
        /* Keep spacer present but zero-sized — wrapper padding-top handles
           vertical clearance. display:none avoids a phantom flex column. */
        display: none;
      }
      .game-wrapper > .game-grid {
        order: 1;
        /* The grid is square. Cap by both viewport dimensions so it fits in the
           landscape window without overflow or collision with the HUD.
           Subtract logo-offset so it never creeps above the logo. */
        max-height: calc(100vh - var(--logo-offset, 180px) - 32px);
        max-width: calc(100vh - var(--logo-offset, 180px) - 32px);
        width: auto;
        height: auto;
      }
      .game-wrapper > .hud {
        order: 2;
        flex-shrink: 0;
        width: 300px;
        max-width: 35vw;
        /* Stack rows vertically inside the HUD even though the HUD itself is in
           a row layout — preserves readability of identity/score/corruption. */
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 0;
      }

      /* Tighten HUD internal spacing for landscape so it fits next to grid */
      .hud .hud-row,
      .hud .hud-identity {
        margin: 0;
      }

      /* On very short landscape (e.g. landscape phone), tighten further */
      @media (max-height: 480px) {
        .game-wrapper {
          gap: 16px;
          padding: 8px;
          padding-top: calc(var(--logo-offset, 120px) + 4px);
        }
        .game-wrapper > .hud {
          width: 240px;
        }
        .game-wrapper > .game-grid {
          max-height: calc(100vh - var(--logo-offset, 120px) - 16px);
          max-width: calc(100vh - var(--logo-offset, 120px) - 16px);
        }
      }
    }

    /* Non-game screens (title, level select, narrative, howto) — keep portrait
       layout always. These screens don't need a landscape variant because they're
       text-and-buttons-centered, not spatially demanding. */
    .screen.title-screen,
    .screen.level-select,
    .screen.narrative-screen,
    .screen.howto-screen {
      /* No orientation-specific overrides — existing centered layout works
         fine in both. */
    }
  </style>

<script>
// ══════════════════════════════════════════════════════════════════════════
//  SPACE BACKGROUND  v2 — pixel-rendered planets, spiral galaxies
// ══════════════════════════════════════════════════════════════════════════
(function () {
  const canvas = document.getElementById('starfield');
  const C = canvas.getContext('2d');
  let W, H;

  function rand(a, b) { return a + Math.random() * (b - a); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }
  function h2(ix, iy) {
    const n = Math.sin(ix * 127.1 + iy * 311.7) * 43758.5453;
    return n - Math.floor(n);
  }
  function sn(x, y, sc) {
    const ix = Math.floor(x/sc), iy = Math.floor(y/sc);
    const fx = x/sc-ix, fy = y/sc-iy;
    const sx = fx*fx*(3-2*fx), sy = fy*fy*(3-2*fy);
    return lerp(lerp(h2(ix,iy),h2(ix+1,iy),sx), lerp(h2(ix,iy+1),h2(ix+1,iy+1),sx), sy);
  }

  // ── Stars ─────────────────────────────────────────────────────────────
  const STAR_LAYERS = [
    {n:200, speed:0.06, minR:0.2, maxR:0.65, baseA:0.30},
    {n: 60, speed:0.18, minR:0.65, maxR:1.30, baseA:0.50},
    {n: 18, speed:0.40, minR:1.30, maxR:2.00, baseA:0.70},
  ];
  let stars = [];
  function initStars() {
    stars = [];
    for (const L of STAR_LAYERS) for (let i=0; i<L.n; i++)
      stars.push({ x:rand(0,W), y:rand(0,H*0.65),
        r:rand(L.minR,L.maxR), spd:L.speed*rand(0.85,1.15),
        baseA:L.baseA*rand(0.6,1.4), ph:rand(0,Math.PI*2), phSpd:rand(0.004,0.018) });
  }

  // ── Shooting stars ────────────────────────────────────────────────────
  let shooters=[], nextShoot=rand(3000,8000), lastShoot=0;
  function spawnShooter() {
    const ang=rand(22,52)*Math.PI/180;
    shooters.push({ x:rand(0,W*0.8), y:rand(0,H*0.35),
      vx:Math.cos(ang)*rand(9,16), vy:Math.sin(ang)*rand(9,16),
      len:rand(80,220), life:1, decay:rand(0.018,0.036), w:rand(1.0,1.8) });
  }

  // ── Static scene canvas (mountains + stones) ──────────────────────────
  let sceneCanvas = null;

  function buildScene() {
    sceneCanvas = document.createElement('canvas');
    sceneCanvas.width = W; sceneCanvas.height = H;
    const sc = sceneCanvas.getContext('2d');

    // ── Sky gradient (solid base — mountains silhouette against this) ──
    const skyFill = sc.createLinearGradient(0,0, 0,H*0.72);
    skyFill.addColorStop(0,    '#07112e');  // midnight navy
    skyFill.addColorStop(0.30, '#0b0d28');  // deep indigo
    skyFill.addColorStop(0.60, '#08091a');  // dark horizon
    skyFill.addColorStop(1,    '#030408');  // near-black at ground
    sc.fillStyle = skyFill;
    sc.fillRect(0, 0, W, H*0.72);

    // ── Moon glow (upper-left — more visible) ──
    const moonX = W*0.18, moonY = H*0.12;
    const moonGlow = sc.createRadialGradient(moonX,moonY,0, moonX,moonY,H*0.32);
    moonGlow.addColorStop(0,   'rgba(255,248,210,0.22)');
    moonGlow.addColorStop(0.25,'rgba(220,205,255,0.12)');
    moonGlow.addColorStop(0.55,'rgba(140,100,220,0.06)');
    moonGlow.addColorStop(1,   'rgba(80,60,120,0)');
    sc.fillStyle=moonGlow;
    sc.fillRect(0,0,W,H*0.72);

    // Moon disc
    const moonDisc = sc.createRadialGradient(moonX,moonY,0, moonX,moonY,28);
    moonDisc.addColorStop(0,  'rgba(255,250,220,0.95)');
    moonDisc.addColorStop(0.5,'rgba(240,235,200,0.60)');
    moonDisc.addColorStop(1,  'rgba(200,190,160,0)');
    sc.fillStyle=moonDisc;
    sc.beginPath(); sc.arc(moonX,moonY,28,0,Math.PI*2); sc.fill();

    // ── Mountain ranges (3 depth layers) ──
    const mtLayers = [
      { seed:1, peaks:9,  base:0.48, height:0.18, col:'rgba(5,3,14,0.96)'   }, // far — pure dark
      { seed:2, peaks:7,  base:0.52, height:0.22, col:'rgba(4,2,10,0.98)'   }, // mid
      { seed:3, peaks:6,  base:0.58, height:0.20, col:'rgba(2,1,6,1.00)'    }, // near — blackest
    ];

    for (const L of mtLayers) {
      sc.beginPath(); sc.moveTo(0, H*L.base);
      // Generate mountain silhouette points
      const pts = [];
      for (let i=0; i<=200; i++) {
        const x = i/200;
        const n1 = sn(x*8 + L.seed*3.7, L.seed, 1)*0.55;
        const n2 = sn(x*20 + L.seed*7.1, L.seed+1, 1)*0.30;
        const n3 = sn(x*50 + L.seed*12, L.seed+2, 1)*0.15;
        const h  = (n1+n2+n3) * L.height;
        pts.push({ x:x*W, y:H*(L.base - h) });
      }
      for (const p of pts) sc.lineTo(p.x, p.y);
      sc.lineTo(W, H); sc.lineTo(0, H); sc.closePath();
      sc.fillStyle = L.col; sc.fill();
    }

    // ── Ground plane ──
    const groundY = H*0.72;
    const gGrad = sc.createLinearGradient(0,groundY, 0,H);
    gGrad.addColorStop(0,  'rgba(5,3,14,0.98)');
    gGrad.addColorStop(0.3,'rgba(3,2,10,1.0)');
    gGrad.addColorStop(1,  '#020108');
    sc.fillStyle=gGrad;
    sc.fillRect(0,groundY,W,H-groundY);

    // ── Standing stones ──
    drawStones(sc, W, H);
  }

  // Pre-computed stone shapes (set once, deterministic)
  let stoneShapes = null;

  function buildStoneShapes(W, H) {
    // Each stone defined as polygon points
    const groundY = H*0.72;
    const shapes = [];

    // Seed-based jitter (deterministic)
    let _seed = 42;
    function jrand() {
      _seed = (_seed * 1664525 + 1013904223) & 0xffffffff;
      return ((_seed >>> 0) / 0xffffffff);
    }
    function jitter(scale) { return (jrand()-0.5)*scale; }

    function stoneRect(cx, baseY, w, h, tiltRad, roughness) {
      // Returns a polygon of ~8 points (slightly irregular rect)
      const hw = w/2;
      const dx = Math.sin(tiltRad)*h;
      const midSegs = 2; // points per side for roughness
      const pts = [];

      // Bottom-left to bottom-right
      pts.push({x: cx-hw+jitter(roughness), y: baseY+jitter(roughness*0.3)});
      pts.push({x: cx+hw+jitter(roughness), y: baseY+jitter(roughness*0.3)});
      // Right side upward
      for (let i=midSegs; i>=1; i--) {
        const t=i/midSegs;
        pts.push({x: cx+hw-dx*(1-t)+jitter(roughness*0.5), y: baseY-h*t+jitter(roughness*0.4)});
      }
      // Top-right to top-left
      pts.push({x: cx+hw-dx+jitter(roughness), y: baseY-h+jitter(roughness)});
      pts.push({x: cx-hw-dx+jitter(roughness), y: baseY-h+jitter(roughness*0.8)});
      // Left side downward
      for (let i=1; i<=midSegs; i++) {
        const t=i/midSegs;
        pts.push({x: cx-hw-dx*(1-t)+jitter(roughness*0.5), y: baseY-h*(1-t)+jitter(roughness*0.4)});
      }
      return pts;
    }

    // ── Define Stonehenge arrangement ──
    // Scale everything to current W/H
    const unit = Math.min(W, H) * 0.01;

    // Outer ring (background, smaller) — 8 stones across
    const outerY  = groundY - unit*0.5;
    const outerStones = [
      {cx:0.08, w:2.0, h:12},
      {cx:0.18, w:2.2, h:14, pair:true},
      {cx:0.28, w:1.8, h:11},
      {cx:0.38, w:2.0, h:13, pair:true},
      {cx:0.62, w:2.0, h:13, pair:true},
      {cx:0.72, w:1.8, h:11},
      {cx:0.82, w:2.2, h:14, pair:true},
      {cx:0.92, w:2.0, h:12},
    ];
    for (const s of outerStones) {
      const cx = W*s.cx, w=s.w*unit, h=s.h*unit;
      const tilt=(jrand()-0.5)*0.06;
      shapes.push({pts:stoneRect(cx,outerY,w,h,tilt,unit*0.15), layer:'outer'});
      if (s.pair) {
        // Lintel on top
        const lw = w*2.4, lh = h*0.28;
        shapes.push({pts:stoneRect(cx,outerY-h+lh*0.2,lw,lh,0,unit*0.10), layer:'outer-lintel'});
      }
    }

    // Inner trilithons (foreground, taller)
    const innerDefs = [
      {cx:0.25, h:24, spread:4.0},
      {cx:0.38, h:30, spread:4.5},  // tallest, centre-left
      {cx:0.50, h:34, spread:5.0},  // tallest, centre
      {cx:0.62, h:30, spread:4.5},
      {cx:0.75, h:24, spread:4.0},
    ];
    for (const s of innerDefs) {
      const cx=W*s.cx, h=s.h*unit, w=2.8*unit, spread=s.spread*unit;
      const innerY = groundY + unit*0.8;

      // Left upright
      const tiltL=(jrand()-0.5)*0.05;
      shapes.push({pts:stoneRect(cx-spread,innerY,w,h,tiltL,unit*0.25), layer:'inner'});
      // Right upright
      const tiltR=(jrand()-0.5)*0.05;
      shapes.push({pts:stoneRect(cx+spread,innerY,w,h,tiltR,unit*0.25), layer:'inner'});
      // Lintel
      const lw=spread*2+w*2, lh=h*0.22;
      shapes.push({pts:stoneRect(cx,innerY-h,lw,lh,0,unit*0.15), layer:'inner-lintel'});
    }

    // Single leaning stones (scattered)
    const singles = [
      {cx:0.05, h:16, tilt: 0.12},
      {cx:0.12, h:12, tilt:-0.08},
      {cx:0.88, h:14, tilt: 0.10},
      {cx:0.95, h:10, tilt:-0.14},
      {cx:0.44, h:8,  tilt: 0.18}, // fallen/leaning
    ];
    for (const s of singles) {
      const cx=W*s.cx, h=s.h*unit, w=2.2*unit;
      shapes.push({pts:stoneRect(cx,groundY+unit,w,h,s.tilt,unit*0.20), layer:'outer'});
    }

    return shapes;
  }

  function drawStones(sc, W, H) {
    if (!stoneShapes) stoneShapes = buildStoneShapes(W, H);

    const moonX = W*0.18;

    for (const shape of stoneShapes) {
      const pts = shape.pts;
      if (!pts || pts.length < 3) continue;

      sc.beginPath();
      sc.moveTo(pts[0].x, pts[0].y);
      for (let i=1; i<pts.length; i++) sc.lineTo(pts[i].x, pts[i].y);
      sc.closePath();

      // Fill: dark stone gradient, lighter on moon-facing side
      const minX = Math.min(...pts.map(p=>p.x));
      const maxX = Math.max(...pts.map(p=>p.x));
      const stoneGrad = sc.createLinearGradient(minX,0, maxX,0);

      if (shape.layer === 'inner' || shape.layer === 'inner-lintel') {
        stoneGrad.addColorStop(0,  '#141020'); // moonlit left edge
        stoneGrad.addColorStop(0.2,'#0c0a18');
        stoneGrad.addColorStop(1,  '#050410');
      } else {
        stoneGrad.addColorStop(0,  '#0e0c1c');
        stoneGrad.addColorStop(0.3,'#070610');
        stoneGrad.addColorStop(1,  '#040309');
      }
      sc.fillStyle = stoneGrad;
      sc.fill();

      // Moonlit left edge highlight
      const isLeftFacing = minX < W*0.5;
      if (shape.layer === 'inner' || shape.layer === 'outer') {
        sc.beginPath();
        sc.moveTo(pts[0].x, pts[0].y);
        for (let i=1; i<pts.length; i++) sc.lineTo(pts[i].x, pts[i].y);
        sc.closePath();
        sc.strokeStyle = shape.layer === 'inner' ? 'rgba(200,185,255,0.30)' : 'rgba(180,165,220,0.18)';
        sc.lineWidth = shape.layer === 'inner' ? 1.5 : 1;
        sc.stroke();
      }

      // Subtle inner crack/texture on large stones
      if (shape.layer === 'inner') {
        const cx2 = (minX+maxX)/2;
        const minY = Math.min(...pts.map(p=>p.y));
        const maxY = Math.max(...pts.map(p=>p.y));
        sc.beginPath();
        sc.moveTo(cx2+rand(-3,3), maxY);
        sc.bezierCurveTo(cx2+rand(-4,4),lerp(maxY,minY,0.3),
                         cx2+rand(-4,4),lerp(maxY,minY,0.6),
                         cx2+rand(-5,5),lerp(maxY,minY,0.85));
        sc.strokeStyle='rgba(30,20,50,0.6)';
        sc.lineWidth=0.7;
        sc.stroke();
      }
    }
  }

  // ── Mist layers (animated) ────────────────────────────────────────────
  // ox/oy = normalized start position, dx = horizontal drift px/ms, ry = vertical spread
  // layer: 'bg' drawn behind stars, 'fg' drawn over everything (above game)
  // Fog system — bg layer on starfield canvas (behind game),
  // fg layer on fog-layer canvas (above everything including game board)
  const fogCanvas = document.getElementById('fog-layer');
  const FC = fogCanvas.getContext('2d');

  function resizeFog() {
    fogCanvas.width  = window.innerWidth;
    fogCanvas.height = window.innerHeight;
  }
  resizeFog();
  window.addEventListener('resize', resizeFog);

  // ox/oy = origin (0–1 normalized), rx/ry = size, maxA = peak alpha,
  // dx = drift speed (px/ms normalised to screen width), layer: bg|fg
  const MIST = [
    // ── Lower banks — heavy ground fog ───────────────────────────────
    {ox:0.50, oy:0.70, rx:0.80, ry:0.10, maxA:0.40, dx: 0.000006, phase:0.0, layer:'bg'},
    {ox:0.20, oy:0.74, rx:0.55, ry:0.09, maxA:0.34, dx:-0.000005, phase:1.4, layer:'bg'},
    {ox:0.80, oy:0.72, rx:0.50, ry:0.09, maxA:0.30, dx: 0.000007, phase:2.8, layer:'bg'},
    {ox:0.50, oy:0.80, rx:0.85, ry:0.11, maxA:0.45, dx: 0.000004, phase:0.6, layer:'bg'},
    {ox:0.30, oy:0.85, rx:0.70, ry:0.10, maxA:0.42, dx:-0.000006, phase:1.9, layer:'bg'},
    {ox:0.70, oy:0.83, rx:0.65, ry:0.09, maxA:0.38, dx: 0.000005, phase:3.2, layer:'bg'},
    // ── Mid-screen banks — drift slowly across ────────────────────────
    {ox:0.00, oy:0.48, rx:0.65, ry:0.09, maxA:0.20, dx: 0.000010, phase:0.7, layer:'bg'},
    {ox:1.00, oy:0.52, rx:0.58, ry:0.08, maxA:0.18, dx:-0.000008, phase:2.2, layer:'bg'},
    {ox:0.35, oy:0.44, rx:0.70, ry:0.08, maxA:0.16, dx: 0.000006, phase:4.1, layer:'bg'},
    {ox:0.75, oy:0.57, rx:0.55, ry:0.08, maxA:0.18, dx:-0.000009, phase:1.5, layer:'bg'},
    // ── Upper wisps ───────────────────────────────────────────────────
    {ox:0.10, oy:0.28, rx:0.48, ry:0.07, maxA:0.12, dx: 0.000013, phase:0.9, layer:'bg'},
    {ox:0.90, oy:0.22, rx:0.42, ry:0.06, maxA:0.10, dx:-0.000011, phase:3.3, layer:'bg'},
    {ox:0.50, oy:0.35, rx:0.55, ry:0.07, maxA:0.11, dx: 0.000009, phase:5.1, layer:'bg'},
    // ── Foreground — floats OVER the game board ────────────────────────
    {ox:-0.10,oy:0.55, rx:0.55, ry:0.08, maxA:0.18, dx: 0.000016, phase:1.2, layer:'fg'},
    {ox: 1.10,oy:0.62, rx:0.50, ry:0.07, maxA:0.16, dx:-0.000014, phase:2.7, layer:'fg'},
    {ox:0.25, oy:0.50, rx:0.45, ry:0.07, maxA:0.14, dx: 0.000018, phase:0.5, layer:'fg'},
    {ox:0.78, oy:0.44, rx:0.48, ry:0.07, maxA:0.14, dx:-0.000016, phase:3.8, layer:'fg'},
    {ox:0.50, oy:0.68, rx:0.60, ry:0.09, maxA:0.20, dx: 0.000012, phase:2.0, layer:'fg'},
    {ox:-0.05,oy:0.75, rx:0.45, ry:0.08, maxA:0.18, dx: 0.000020, phase:4.5, layer:'fg'},
    {ox: 1.05,oy:0.38, rx:0.42, ry:0.07, maxA:0.13, dx:-0.000018, phase:1.8, layer:'fg'},
  ];

  function drawFogOnCtx(ctx, W, H, now, layerName) {
    for (const m of MIST) {
      if (m.layer !== layerName) continue;
      // Smooth horizontal drift with seamless wrap — ox is normalized (0–1), must multiply by W
      const cx = ((m.ox * W + now * m.dx * W) % W + W) % W;
      const cy = m.oy * H + Math.sin(now * 0.00016 + m.phase) * H * 0.018;
      const rx = m.rx * W;
      const ry = m.ry * H;
      // Breathe: alpha pulses in and out slowly
      const alpha = m.maxA * (0.4 + 0.6 * (0.5 + 0.5 * Math.sin(now * 0.00018 + m.phase)));

      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(rx / 100, ry / 100);
      const g = ctx.createRadialGradient(0,0,0, 0,0,100);
      g.addColorStop(0,   `rgba(220,210,255,${alpha})`);
      g.addColorStop(0.35,`rgba(195,185,245,${alpha * 0.60})`);
      g.addColorStop(0.70,`rgba(170,160,230,${alpha * 0.25})`);
      g.addColorStop(1,   'rgba(145,138,215,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0,0,100,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }
  }

  function drawMist(now) { drawFogOnCtx(C, W, H, now, 'bg'); }

  // ── Nebulae (dim, purple/red only — fits the mood) ────────────────────
  let nebCanvas = null;
  function buildNebulae() {
    nebCanvas = document.createElement('canvas');
    nebCanvas.width=W; nebCanvas.height=H;
    const nc = nebCanvas.getContext('2d');
    const defs = [
      {x:0.12,y:0.18,rx:0.24,ry:0.16, r:100,g:20, b:160,a:0.045},
      {x:0.78,y:0.22,rx:0.20,ry:0.15, r:160,g:20, b:80, a:0.038},
      {x:0.50,y:0.30,rx:0.32,ry:0.12, r:60, g:30, b:140,a:0.030},
    ];
    for (const n of defs) {
      nc.save();
      nc.translate(n.x*W, n.y*H);
      nc.scale(n.rx*W/100, n.ry*H/100);
      const g=nc.createRadialGradient(0,0,0, 0,0,100);
      g.addColorStop(0,   `rgba(${n.r},${n.g},${n.b},${n.a})`);
      g.addColorStop(0.6, `rgba(${n.r},${n.g},${n.b},${n.a*0.3})`);
      g.addColorStop(1,   'rgba(0,0,0,0)');
      nc.fillStyle=g;
      nc.beginPath(); nc.arc(0,0,100,0,Math.PI*2); nc.fill();
      nc.restore();
    }
  }

  // ── Floating narrative text ───────────────────────────────────────────
  const NARR_PHRASES = [
    'Before, there were three forms.',
    'The Circle, perfect and unbroken.',
    'The Square, balanced and certain.',
    'The Triangle, sharp and resolute.',
    'The world forgot what the three forms were.',
    'The sacred forms went unhonored.',
    'The disrespect built and built.',
    'Even the sleeping forms could feel it.',
    'The Hexagon, with its imitation of order.',
    'The Star, with its arrogant geometry.',
    'The Moon, hollow where roundness should be.',
    'Each one a hunter.',
    'The universe had drifted from grammar into noise.',
    'They are themselves but barely.',
    'Walk the line between strength and dissolution.',
    'They remember being three.',
    'The grammar of reality is spoken again.',
    'The world remembers.',
    'Every stone, every star was built from these.',
    'To restore the universe, they must outlast the hunters.',
  ];

  const MAX_NARR = 2;
  let narrTexts = [];
  let narrNextSpawn = rand(4000, 9000);
  let narrLastSpawn = 0;

  function spawnNarrText(now) {
    if (narrTexts.length >= MAX_NARR) return;
    const phrase = NARR_PHRASES[Math.floor(rand(0, NARR_PHRASES.length))];
    narrTexts.push({
      text: phrase,
      x: rand(0.06, 0.70) * W,
      y: rand(0.08, 0.55) * H,
      birth: now,
      fadeIn: 3000,
      hold: rand(6000, 11000),
      fadeOut: 3500,
    });
  }

  function drawNarrTexts(now) {
    C.save();
    C.font = `400 ${Math.max(11, W * 0.013)}px 'Cinzel Decorative', serif`;
    C.textAlign = 'left';
    for (let i = narrTexts.length - 1; i >= 0; i--) {
      const n = narrTexts[i];
      const age = now - n.birth;
      const total = n.fadeIn + n.hold + n.fadeOut;
      if (age > total) { narrTexts.splice(i, 1); continue; }

      const maxAlpha = window.sfPhotoMode ? 0.11 : 0.065;
      let alpha;
      if (age < n.fadeIn)                    alpha = (age / n.fadeIn) * maxAlpha;
      else if (age < n.fadeIn + n.hold)      alpha = maxAlpha;
      else                                   alpha = (1 - (age - n.fadeIn - n.hold) / n.fadeOut) * maxAlpha;

      C.fillStyle = `rgba(200,190,240,${alpha})`;
      C.fillText(n.text, n.x, n.y);
    }
    C.restore();
  }

  // ── Init & main loop ──────────────────────────────────────────────────
  function init() {
    W=canvas.width =window.innerWidth;
    H=canvas.height=window.innerHeight;
    stoneShapes=null; // rebuild on resize
    initStars();
    buildNebulae();
    buildScene();
  }

  function draw(now) {
    C.clearRect(0,0,W,H);

    // Stars — always rendered
    for (const s of stars) {
      s.y+=s.spd; if(s.y>H*0.65+s.r){s.y=-s.r;s.x=rand(0,W);}
      s.ph+=s.phSpd;
      const a=Math.max(0.03,s.baseA*(0.70+0.30*Math.sin(s.ph)));
      C.beginPath(); C.arc(s.x,s.y,s.r,0,Math.PI*2);
      C.fillStyle=`rgba(220,215,255,${a})`; C.fill();
    }

    if (!window.sfPhotoMode) {
      // Full generated scene (no photo bg)
      C.globalAlpha=0.75+0.25*Math.sin(now*0.00022);
      C.drawImage(nebCanvas,0,0);
      C.globalAlpha=1;
      C.drawImage(sceneCanvas,0,0);
    }

    // Fog — always rendered over whatever background is active
    drawMist(now);

    // Shooting stars (rare)
    if(now-lastShoot>nextShoot){spawnShooter();lastShoot=now;nextShoot=rand(4000,10000);}
    for(let i=shooters.length-1;i>=0;i--){
      const s=shooters[i];
      s.x+=s.vx;s.y+=s.vy;s.life-=s.decay;
      if(s.life<=0){shooters.splice(i,1);continue;}
      const spd=Math.sqrt(s.vx*s.vx+s.vy*s.vy);
      const tx=s.x-s.vx*(s.len/spd)*0.55;
      const ty=s.y-s.vy*(s.len/spd)*0.55;
      const gr=C.createLinearGradient(tx,ty,s.x,s.y);
      gr.addColorStop(0,'rgba(255,255,255,0)');
      gr.addColorStop(0.65,`rgba(210,200,255,${s.life*0.5})`);
      gr.addColorStop(1,`rgba(255,255,255,${s.life})`);
      C.beginPath();C.moveTo(tx,ty);C.lineTo(s.x,s.y);
      C.strokeStyle=gr;C.lineWidth=s.w*s.life;C.stroke();
      C.beginPath();C.arc(s.x,s.y,s.w*s.life*1.4,0,Math.PI*2);
      C.fillStyle=`rgba(240,235,255,${s.life*0.85})`;C.fill();
    }

    // Floating narrative text — always on, alpha adjusts per sfPhotoMode
    if (now - narrLastSpawn > narrNextSpawn) {
      spawnNarrText(now); narrLastSpawn = now; narrNextSpawn = rand(6000, 14000);
    }
    drawNarrTexts(now);

    // Foreground fog — separate canvas above everything including game board
    FC.clearRect(0, 0, fogCanvas.width, fogCanvas.height);
    drawFogOnCtx(FC, fogCanvas.width, fogCanvas.height, now, 'fg');

    requestAnimationFrame(draw);
  }

  // Start in photo mode — title bg is shown on load
  window.sfPhotoMode = true;

  window.addEventListener('resize', init);
  init();
  requestAnimationFrame(draw);

  // ── Logo height sync — measures actual rendered logo, sets CSS var ──
  // All spacers in ui.js read window.__logoH; CSS reads --logo-h
  function syncLogoH() {
    const logo = document.getElementById('global-logo');
    if (!logo) return;
    const h = logo.getBoundingClientRect().bottom + 16; // 16px breathing gap
    document.documentElement.style.setProperty('--logo-h', `${h}px`);
    // Also expose as --logo-offset for landscape layout padding-top calculation
    document.documentElement.style.setProperty('--logo-offset', `${h}px`);
    window.__logoH = h;
  }
  // Run after fonts load (Cinzel Decorative affects height)
  if (document.fonts) {
    document.fonts.ready.then(() => { syncLogoH(); });
  }
  syncLogoH(); // immediate estimate

  // Show DEV badge when running under /dev path
  if (window.location.pathname.startsWith('/dev')) {
    const badge = document.getElementById('dev-badge');
    if (badge) badge.style.display = 'block';
  }
  window.addEventListener('resize', syncLogoH);
  window.addEventListener('orientationchange', () => setTimeout(syncLogoH, 150));

  // Logo click → home screen from anywhere
  document.getElementById('global-logo').addEventListener('click', () => {
    if (window.__sfGame) window.__sfGame.showTitle();
  });
})();


// ══════════════════════════════════════════════════════════════════════════
//  AMBIENT MUSIC  — real tracks, sequential loop forever
// ══════════════════════════════════════════════════════════════════════════
(function () {
  const btn     = document.getElementById('music-btn');
  const TRACKS  = [
    '/music/cry_for_the_wind.ogg',
    '/music/journey_is_too_long.ogg',
    '/music/snowy_day_at_home.ogg',
    '/music/chasing_squares.ogg',
    '/music/lets_get_the_melody_right.ogg',
    '/music/under_a_metal_atmosphere.ogg',
    '/music/unsettled.ogg',
    '/music/when_i_dream_i_see_nothing.ogg',
  ];
  const NAMES = [
    'Cry for the Wind',
    'Journey is Too Long',
    'Snowy Day at Home',
    'Chasing Squares',
    'Let\'s Get the Melody Right',
    'Under a Metal Atmosphere',
    'Unsettled',
    'When I Dream I See Nothing',
  ];

  // Start on a random track each page load
  let idx     = Math.floor(Math.random() * TRACKS.length);
  let playing = false;
  let audio   = null;

  function showName(name) {
    const el = document.createElement('div');
    el.textContent = name;
    el.style.cssText = 'position:fixed;bottom:72px;right:16px;font-size:0.72rem;' +
      'color:#9060ff;opacity:0;transition:opacity 0.5s;pointer-events:none;' +
      'font-family:var(--font-eerie);letter-spacing:0.1em;text-align:right;' +
      'text-shadow:0 0 8px rgba(140,60,220,0.6);z-index:100;';
    document.body.appendChild(el);
    requestAnimationFrame(() => el.style.opacity = '1');
    setTimeout(() => {
      el.style.opacity = '0';
      setTimeout(() => el.remove(), 600);
    }, 3500);
  }

  function playWhenReady() {
    if (!playing) return;
    // If already buffered enough, play immediately; otherwise wait for canplay
    const go = () => audio.play().catch(() => setTimeout(playWhenReady, 400));
    if (audio.readyState >= 2) { go(); }
    else { audio.addEventListener('canplay', go, { once: true }); }
  }

  function loadTrack(trackIdx) {
    if (audio) { audio.pause(); audio.src = ''; }
    audio = new Audio(TRACKS[trackIdx]);
    audio.volume = 0.72;
    audio.preload = 'auto';
    audio.load();
    audio.addEventListener('ended', () => {
      idx = (idx + 1) % TRACKS.length;
      loadTrack(idx);
      if (playing) {
        showName(NAMES[idx]);
        playWhenReady();
      }
    });
    audio.addEventListener('error', () => {
      // Skip broken/missing track gracefully
      idx = (idx + 1) % TRACKS.length;
      loadTrack(idx);
      if (playing) playWhenReady();
    });
  }

  function startMusic() {
    if (!audio) loadTrack(idx);
    audio.play().then(() => {
      playing = true;
      btn.textContent = '🔊';
      showName(NAMES[idx]);
    }).catch(() => {});
  }

  function stopMusic() {
    if (audio) audio.pause();
    playing = false;
    btn.textContent = '🔇';
  }

  // Pre-load first track
  loadTrack(idx);

  btn.addEventListener('click', () => { if (playing) stopMusic(); else startMusic(); });

  // Auto-start on first user interaction (mobile AudioContext unlock)
  function onFirstInteraction() {
    if (!playing) startMusic();
    document.removeEventListener('click', onFirstInteraction);
    document.removeEventListener('touchstart', onFirstInteraction);
  }
  document.addEventListener('click', onFirstInteraction);
  document.addEventListener('touchstart', onFirstInteraction);
})();
</script>
</body>
</html>
